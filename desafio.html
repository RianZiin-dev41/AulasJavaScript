<body>
    <h1>OLÁ MUNDO</h1>
    <hr>
    <script>
        window.alert("Seja bem-vindo ao site");
        let num1 = parseFloat(window.prompt("Digite o primeiro número: "));
        let num2 = parseFloat(window.prompt("Digite o segundo número: "));
        let result = window.prompt ("Digite + para soma ou - para subtração");

        if(result== "+"){
            resultado = num1 + num2;
        }else{
            resultado = num1 - num2;
        }
        window.alert("O resultado é " + resultado);
    </script>
